server.port=8081

#eureka server configuration in application.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/user_microservice
spring.datasource.username=postgres
spring.datasource.password=dine
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=org.postgresql.Driver


# Logging
logging.level.root=INFO
logging.level.com.userservice=DEBUG
logging.file.name=logs/user-service.log

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n