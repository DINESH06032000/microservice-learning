spring.application.name=order-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/order_microservice
spring.datasource.username=postgres
spring.datasource.password=dine
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=org.postgresql.Driver

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

resilience4j.circuitbreaker.instances.USER-SERVICE.slidingWindowSize=10
resilience4j.circuitbreaker.instances.USER-SERVICE.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.USER-SERVICE.failureRateThreshold=50
resilience4j.circuitbreaker.instances.USER-SERVICE.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.USER-SERVICE.permittedNumberOfCallaInHalfOpenState=3

resilience4j.ratelimiter.instances.USER-SERVICE.limitForPeriod=5
resilience4j.ratelimiter.instances.USER-SERVICE.limitRefreshPeriod=10s
resilience4j.ratelimiter.instances.USER-SERVICE.timeoutDuration=0

resilience4j.retry.instances.USER-SERVICE.maxAttempt=3
resilience4j.retry.instances.USER-SERVICE.waitDuration=1s

resilience4j.timelimiter.instances.USER-SERVICE.timeoutDuration=3s
resilience4j.timelimiter.instances.USER-SERVICE.cancelRunningFuture=true


management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,ratelimiters,retries,bulkheads
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true