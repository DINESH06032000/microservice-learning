spring.application.name=config-server
server.port=8888

spring.cloud.config.server.git.uri=https://github.com/DINESH06032000/microservice-learning.git
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.search-paths=config-repo


# Logging
logging.level.root=INFO
logging.level.org.springframework.cloud.config=INFO
logging.file.name=logs/config-server.log

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [CorrelationId=%X{correlationId}] %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [CorrelationId=%X{correlationId}] %logger{36} - %msg%n